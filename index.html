<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NovaPlay | Channel Manager</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b91c1c;
            --bg: #080a10;
            --card-bg: #11151f;
            --input-bg: #1a1f2e;
            --text: #ffffff;
            --text-muted: #9aa3b2;
            --border: #293246;
            --success: #10b981;
            --error: #ef4444;
            --nav-height: 70px;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* Navegación Premium - Estandarizada con novaplaytv.github.io */
        .nova-nav { position: fixed; top: 0; width: 100%; z-index: 10000; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-inner { max-width: 1400px; margin: auto; height: var(--nav-height); padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 22px; letter-spacing: -1px; }
        .nav-brand img { width: 36px; height: 32px; border-radius: 8px; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; padding: 10px 15px; border-radius: 10px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-links a.active { color: var(--primary); }

        .btn-login-nav, .btn-logout {
            background: var(--primary);
            color: #fff !important;
            font-weight: 800 !important;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            display: none;
            transition: 0.2s;
        }
        .btn-login-nav:hover, .btn-logout:hover { transform: scale(1.05); background: var(--primary-hover); }
        .btn-logout { background: var(--error); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        .app-container { display: flex; height: calc(100% - var(--nav-height)); margin-top: var(--nav-height); overflow: hidden; }

        /* Sidebar */
        #sidebar { width: var(--sidebar-width); background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        #category-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .category-item { padding: 12px 15px; margin-bottom: 5px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; color: var(--text-muted); font-weight: 600; font-size: 14px; }
        .category-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .category-item.active { background: var(--primary); color: #fff; }
        .category-item.special { border-bottom: 1px solid var(--border); margin-bottom: 15px; border-radius: 0; padding-bottom: 15px; }
        .category-item .actions { opacity: 0; display: flex; gap: 5px; }
        .category-item:hover .actions { opacity: 1; }

        /* Main Content */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
        header { padding: 15px 30px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 20px; }

        .search-box { position: relative; width: 300px; }
        .search-box input { width: 100%; padding: 12px 15px 12px 40px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; }
        .search-box::before { content: "🔍"; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 14px; }

        .stats-container { display: flex; gap: 10px; }
        .stat-chip { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .stat-chip.success { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }
        .stat-chip.inactive { background: rgba(154,163,178,0.1); color: var(--text-muted); border: 1px solid rgba(154,163,178,0.2); }

        #channel-list { flex-grow: 1; padding: 25px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; align-content: start; }

        /* Channel Card */
        .channel-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: move; transition: 0.2s; position: relative; }
        .channel-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .channel-card.no-drag { cursor: default; }
        .channel-logo { width: 50px; height: 50px; border-radius: 12px; background: #000; object-fit: contain; border: 1px solid var(--border); }
        .channel-info { overflow: hidden; }
        .channel-info h3 { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 700; }
        .channel-info p { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .channel-cat-tag { position: absolute; top: 10px; right: 10px; font-size: 9px; background: var(--input-bg); padding: 3px 8px; border-radius: 6px; color: var(--primary); font-weight: 900; text-transform: uppercase; }

        /* Buttons */
        .btn { padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-primary:disabled { background: var(--border); cursor: not-allowed; transform: none; }
        .btn-ghost { background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--border); color: #fff; }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-icon { background: none; border: none; color: inherit; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 14px; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 20000; padding: 20px; }
        .modal { background: var(--card-bg); width: 100%; max-width: 850px; max-height: 90vh; border-radius: 30px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
        .modal-header { padding: 25px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 30px; overflow-y: auto; }
        .form-section { margin-bottom: 25px; padding: 20px; background: var(--input-bg); border-radius: 20px; border: 1px solid var(--border); }
        .form-section h4 { color: var(--primary); margin-bottom: 15px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: var(--primary); }

        /* Auth View */
        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: flex; justify-content: center; align-items: center; }
        .auth-card { width: 400px; padding: 50px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); text-align: center; }
        .status { margin-top: 15px; padding: 14px; border-radius: 12px; font-size: 13px; font-weight: 800; display: none; text-align: center; }
        .status.success { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid var(--success); }
        .status.error { background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid var(--error); }

        /* Toast Notification System */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 30000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast-msg {
            pointer-events: auto;
            min-width: 300px;
            max-width: 450px;
            background: rgba(17, 21, 31, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: toast-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .toast-msg::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .toast-msg.success::before { background: var(--success); }
        .toast-msg.error::before { background: var(--error); }
        .toast-msg.info::before { background: var(--primary); }

        .toast-content {
            flex-grow: 1;
            font-size: 14px;
            font-weight: 600;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast-close:hover { color: #fff; }

        @keyframes toast-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast-out {
            transform: translateX(120%);
            opacity: 0;
        }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .sortable-ghost { opacity: 0.3; border: 2px dashed var(--primary); }

        @media (max-width: 768px) {
            .nav-inner { padding: 0 15px; }
            .nav-links a:not(.btn-login-nav):not(.btn-logout) { display: none; }
            .sidebar-width { width: 80px; }
            #sidebar span { display: none; }
            #sidebar .category-item { justify-content: center; }
        }
    </style>
</head>
<body>

<nav class="nova-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="https://novaplaytv.github.io/">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="Logo">
            NOVAPLAY
        </a>
        <div class="nav-links">
            <a href="https://novaplaytv.github.io/">INICIO</a>
            <a href="https://novaplaytv.github.io/DEMO-NOVAPLAY/">WEB DEMO</a>
            <a href="https://novaplaytv.github.io/novaimg/actualizar-icono/" id="navPanelImg" style="display:none;">PANEL IMG</a>
            <a href="#" class="btn-login-nav" id="navLogin" onclick="location.reload()">INGRESAR</a>
            <button class="btn-logout" id="navLogout" onclick="cerrarSesion()">SALIR</button>
        </div>
    </div>
</nav>

<div id="auth-view">
    <div class="auth-card">
        <h2 style="margin-bottom:30px; font-weight:900; font-size: 28px;">Acceso al Panel</h2>
        <div class="form-group" style="text-align: left;">
            <label>Usuario</label>
            <input type="text" id="username" placeholder="Usuario" autocomplete="username">
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="loginButton" style="width:100%; justify-content:center; margin-top:10px; padding: 18px;" onclick="iniciarSesion()">ENTRAR AL PANEL</button>
        <div id="loginStatus" class="status"></div>
    </div>
</div>

<script>
    // Session Persistence: Immediate Hide
    if (localStorage.getItem("novaplay_session_token")) {
        document.getElementById("auth-view").classList.add("hidden");
    }
</script>

<div class="app-container">
    <aside id="sidebar">
        <div id="category-list"></div>
        <div style="padding: 20px; border-top: 1px solid var(--border);">
            <button class="btn btn-ghost" style="width:100%; justify-content: center;" onclick="openCategoryModal()">
                <i class="fas fa-plus-circle"></i> Nueva Categoría
            </button>
        </div>
    </aside>

    <main id="main-content">
        <header>
            <div class="header-left">
                <div class="search-box">
                    <input type="text" id="channel-search" placeholder="Buscar canal..." oninput="filterChannels()">
                </div>
                <div class="stats-container">
                    <div class="stat-chip success">
                        <i class="fas fa-check-circle"></i> <span id="active-count">0</span> Activos
                    </div>
                    <div class="stat-chip inactive">
                        <i class="fas fa-times-circle"></i> <span id="inactive-count">0</span> Inactivos
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:12px;">
                <button class="btn btn-primary" id="new-channel-btn" onclick="openChannelModal()">
                    <i class="fas fa-plus"></i> Nuevo Canal
                </button>
                <button class="btn btn-ghost" onclick="saveData()">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </header>

        <div id="channel-list"></div>
    </main>
</div>

<!-- Channel Modal -->
<div id="channel-modal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title" style="font-weight:900;">Editar Canal</h2>
            <button class="btn-icon" onclick="closeModal('channel-modal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-channel-index">
            <input type="hidden" id="edit-channel-cat-index">

            <div class="form-section">
                <h4>Información General</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Nombre del Canal</label>
                        <input type="text" id="ch-name" placeholder="Ej: HBO HD">
                    </div>
                    <div class="form-group">
                        <label>Logo URL (icono)</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="ch-icono" placeholder="https://...">
                            <button class="btn btn-ghost" onclick="document.getElementById('file-upload').click()" title="Subir de PC">
                                <i class="fas fa-upload"></i>
                            </button>
                            <input type="file" id="file-upload" accept="image/*" style="display:none;" onchange="uploadIcon()">
                        </div>
                    </div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Número de Canal (canal)</label>
                        <input type="text" id="ch-canal" placeholder="Ej: 101">
                    </div>
                    <div class="form-group">
                        <label>Estado (status)</label>
                        <select id="ch-status">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>NSFW</label>
                        <select id="ch-nsfw">
                            <option value="NO">NO</option>
                            <option value="YES">YES</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4>Fuentes de Stream</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>URL Principal</label>
                        <input type="text" id="ch-url" placeholder="http://...">
                    </div>
                    <div class="form-group">
                        <label>URL 2</label>
                        <input type="text" id="ch-url2" placeholder="http://...">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4>Configuración Avanzada</h4>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Referer</label>
                        <input type="text" id="ch-referer" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Origin</label>
                        <input type="text" id="ch-origin" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>User Agent (User-Agent)</label>
                        <input type="text" id="ch-user" placeholder="Mozilla/5.0...">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>DRM License URI</label>
                        <input type="text" id="ch-drm1" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>DRM License URI 2</label>
                        <input type="text" id="ch-drm2" placeholder="https://...">
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; padding-top: 10px;">
                <button class="btn btn-danger" onclick="deleteChannel()">Eliminar</button>
                <button class="btn btn-primary" onclick="saveChannel()">Guardar Canal</button>
            </div>
        </div>
    </div>
</div>

<!-- Category Modal -->
<div id="category-modal" class="modal-overlay">
    <div class="modal" style="max-width: 450px;">
        <div class="modal-header">
            <h2 style="font-weight:900;">Categoría</h2>
            <button class="btn-icon" onclick="closeModal('category-modal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-category-index">
            <div class="form-group">
                <label>Nombre de la Categoría (title)</label>
                <input type="text" id="cat-title" placeholder="Ej: Deportes">
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 18px;" onclick="saveCategory()">Guardar</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    const API_URL = 'https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-canales';
    const API_ICON_URL = 'https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-icono';
    let catalogo = [];
    let currentCategoryIndex = -1; // -1: Todos, -2: Inactivos
    let sessionToken = localStorage.getItem("novaplay_session_token") || "";

    function novaToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-msg ${type}`;

        let icon = 'fa-check-circle';
        if (type === 'error') icon = 'fa-exclamation-circle';
        if (type === 'info') icon = 'fa-info-circle';

        toast.innerHTML = `
            <i class="fas ${icon}" style="color: ${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--error)' : 'var(--primary)'}"></i>
            <div class="toast-content">${message}</div>
            <button class="toast-close" onclick="this.parentElement.classList.add('toast-out'); setTimeout(() => this.parentElement.remove(), 300)">
                <i class="fas fa-times"></i>
            </button>
        `;

        container.appendChild(toast);

        setTimeout(() => {
            if (toast.parentElement) {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 300);
            }
        }, 5000);
    }

    // --- Auth & API ---
    function mostrarEstado(id, tipo, mensaje) {
        const el = document.getElementById(id);
        if (!el) return;
        el.className = "status " + tipo;
        el.textContent = mensaje;
        el.style.display = "block";
    }

    async function fetchJSON(body, usarSesion = false) {
        const headers = { "Content-Type": "application/json" };
        if (usarSesion && sessionToken) headers.Authorization = "Bearer " + sessionToken;
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers,
                body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({ error: "Respuesta inválida." }));
            return { response, data };
        } catch (e) {
            return { response: { ok: false }, data: { error: "Error de red." } };
        }
    }

    async function restaurarSesion() {
        const token = localStorage.getItem("novaplay_session_token");
        if (token) {
            sessionToken = token;
            UI_MostrarPanel();
            await loadData();
        } else {
            UI_MostrarLogin();
        }
    }

    function UI_MostrarPanel() {
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("navLogin").style.display = 'none';
        document.getElementById("navLogout").style.display = 'block';
        document.getElementById("navPanelImg").style.display = 'block';
    }

    function UI_MostrarLogin() {
        document.getElementById("auth-view").classList.remove("hidden");
        document.getElementById("navLogin").style.display = 'block';
        document.getElementById("navLogout").style.display = 'none';
        document.getElementById("navPanelImg").style.display = 'none';
    }

    async function iniciarSesion() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const btn = document.getElementById("loginButton");
        const statusId = "loginStatus";

        if (!username || !password) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFICANDO...';

        const { response, data } = await fetchJSON({ action: "login", username, password });

        if (response.ok && data.token) {
            sessionToken = data.token;
            localStorage.setItem("novaplay_session_token", sessionToken);
            UI_MostrarPanel();
            await loadData();
        } else {
            mostrarEstado(statusId, "error", "Acceso denegado.");
            btn.disabled = false;
            btn.textContent = "ENTRAR AL PANEL";
        }
    }

    function cerrarSesion() {
        localStorage.removeItem("novaplay_session_token");
        location.reload();
    }

    // --- Logo Upload Logic ---
    async function uploadIcon() {
        const fileInput = document.getElementById('file-upload');
        const file = fileInput.files[0];
        if (!file) return;

        const iconInput = document.getElementById('ch-icono');
        const originalPlaceholder = iconInput.placeholder;
        iconInput.placeholder = "⚡ SUBIENDO...";
        iconInput.value = "";

        const fd = new FormData();
        fd.append("action", "actualizar");
        fd.append("canal", "auto.webp");
        fd.append("imagen", file);

        try {
            const res = await fetch(API_ICON_URL, {
                method: "POST",
                headers: { "Authorization": "Bearer " + sessionToken },
                body: fd
            });
            const data = await res.json();
            if (res.ok && data.url) {
                iconInput.value = data.url;
            } else {
                novaToast("Error al subir imagen: " + (data.error || "Desconocido"), "error");
            }
        } catch (e) {
            novaToast("Error de red al subir imagen.", "error");
        } finally {
            iconInput.placeholder = originalPlaceholder;
            fileInput.value = "";
        }
    }

    async function loadData() {
        const { response, data } = await fetchJSON({ action: "obtener_json" }, true);
        if (response.ok && data.success) {
            catalogo = data.json || [];

            catalogo.forEach(cat => {
                (cat.items || []).forEach(ch => {
                    if (ch.user && !ch['User-Agent']) {
                        ch['User-Agent'] = ch.user;
                        delete ch.user;
                    }
                });
            });

            try {
                const deployedRes = await fetch('https://mrghnngupolsgatcmevw.supabase.co/storage/v1/object/public/Novaplay/novaplay.json', { cache: 'no-store' });
                if (deployedRes.ok) {
                    const deployedData = await deployedRes.json();
                    mapNumbers(deployedData);
                }
            } catch (e) {
                console.warn("Could not fetch deployed numbers", e);
            }

            renderCategories();
        } else {
            novaToast('Error al cargar datos: ' + (data.error || 'Sesión expirada'), 'error');
            if (response.status === 401) cerrarSesion();
        }
    }

    function mapNumbers(deployedData) {
        let deployedItems = [];
        if (Array.isArray(deployedData)) {
            if (deployedData.length > 0 && deployedData[0].items) {
                deployedData.forEach(cat => deployedItems.push(...(cat.items || [])));
            } else {
                deployedItems = deployedData;
            }
        } else if (deployedData.items) {
            deployedItems = deployedData.items;
        }

        const numMap = {};
        deployedItems.forEach(item => {
            if (item.name && item.canal) {
                numMap[item.name.toLowerCase().trim()] = item.canal;
            }
        });

        catalogo.forEach(cat => {
            (cat.items || []).forEach(ch => {
                const nameKey = (ch.name || "").toLowerCase().trim();
                if (numMap[nameKey]) {
                    ch.canal = numMap[nameKey];
                }
            });
        });
    }

    async function saveData() {
        const { response, data } = await fetchJSON({
            action: "guardar_json",
            content: JSON.stringify(catalogo)
        }, true);

        if (response.ok && data.success) {
            novaToast('Datos guardados correctamente en Supabase', 'success');
        } else {
            novaToast('Error al guardar: ' + (data.error || 'Desconocido'), 'error');
        }
    }

    // --- Stats ---
    function updateStats() {
        let active = 0;
        let inactive = 0;
        catalogo.forEach(cat => {
            (cat.items || []).forEach(ch => {
                if (String(ch.status) === 'true') active++;
                else inactive++;
            });
        });
        document.getElementById('active-count').textContent = active;
        document.getElementById('inactive-count').textContent = inactive;
    }

    // --- Renderers ---
    function renderCategories() {
        const list = document.getElementById('category-list');
        list.innerHTML = '';

        // Fixed Item: Todos
        const todosItem = document.createElement('div');
        todosItem.className = `category-item ${currentCategoryIndex === -1 ? 'active' : ''}`;
        todosItem.innerHTML = `<span><i class="fas fa-layer-group"></i> Todos</span>`;
        todosItem.onclick = () => selectCategory(-1);
        list.appendChild(todosItem);

        // Fixed Item: Inactivos
        const inactivosItem = document.createElement('div');
        inactivosItem.className = `category-item special ${currentCategoryIndex === -2 ? 'active' : ''}`;
        inactivosItem.innerHTML = `<span><i class="fas fa-times-circle"></i> Inactivos</span>`;
        inactivosItem.onclick = () => selectCategory(-2);
        list.appendChild(inactivosItem);

        const dragList = document.createElement('div');
        dragList.id = 'draggable-categories';
        list.appendChild(dragList);

        catalogo.forEach((cat, index) => {
            const item = document.createElement('div');
            item.className = `category-item ${index === currentCategoryIndex ? 'active' : ''}`;
            item.innerHTML = `
                <span><i class="fas fa-folder"></i> ${cat.title}</span>
                <div class="actions">
                    <button class="btn-icon" onclick="openCategoryModal(${index})"><i class="fas fa-edit"></i></button>
                    <button class="btn-icon" onclick="deleteCategory(${index})"><i class="fas fa-trash"></i></button>
                </div>
            `;
            item.onclick = (e) => {
                if (e.target.closest('.actions')) return;
                selectCategory(index);
            };
            dragList.appendChild(item);
        });

        if (!dragList._sortable) {
            dragList._sortable = new Sortable(dragList, {
                animation: 150,
                onEnd: (evt) => {
                    const movedItem = catalogo.splice(evt.oldIndex, 1)[0];
                    catalogo.splice(evt.newIndex, 0, movedItem);
                    if (currentCategoryIndex >= 0) {
                        if (currentCategoryIndex === evt.oldIndex) currentCategoryIndex = evt.newIndex;
                        else if (currentCategoryIndex > evt.oldIndex && currentCategoryIndex <= evt.newIndex) currentCategoryIndex--;
                        else if (currentCategoryIndex < evt.oldIndex && currentCategoryIndex >= evt.newIndex) currentCategoryIndex++;
                    }
                    renderCategories();
                }
            });
        }
        renderChannels();
        updateStats();
    }

    function selectCategory(index) {
        currentCategoryIndex = index;
        renderCategories();
    }

    function renderChannels(filter = '') {
        const list = document.getElementById('channel-list');
        list.innerHTML = '';

        let channelsToRender = [];

        if (currentCategoryIndex === -1) {
            catalogo.forEach((cat, catIdx) => {
                (cat.items || []).forEach((ch, chIdx) => {
                    channelsToRender.push({ ...ch, catIdx, chIdx, catTitle: cat.title });
                });
            });
            document.getElementById('new-channel-btn').disabled = true;
            document.getElementById('new-channel-btn').title = "Seleccione una categoría para agregar canales";
        } else if (currentCategoryIndex === -2) {
            catalogo.forEach((cat, catIdx) => {
                (cat.items || []).forEach((ch, chIdx) => {
                    if (String(ch.status) !== 'true') {
                        channelsToRender.push({ ...ch, catIdx, chIdx, catTitle: cat.title });
                    }
                });
            });
            document.getElementById('new-channel-btn').disabled = true;
            document.getElementById('new-channel-btn').title = "No se pueden agregar canales en la vista Inactivos";
        } else {
            const cat = catalogo[currentCategoryIndex];
            if (cat) {
                (cat.items || []).forEach((ch, chIdx) => {
                    channelsToRender.push({ ...ch, catIdx: currentCategoryIndex, chIdx });
                });
            }
            document.getElementById('new-channel-btn').disabled = false;
            document.getElementById('new-channel-btn').title = "";
        }

        channelsToRender.forEach((ch) => {
            if (filter && !ch.name.toLowerCase().includes(filter.toLowerCase())) return;

            const card = document.createElement('div');
            card.className = 'channel-card' + (currentCategoryIndex < 0 ? ' no-drag' : '');
            card.innerHTML = `
                <img src="${ch.icono}" class="channel-logo" onerror="this.src='https://via.placeholder.com/50?text=?'">
                <div class="channel-info">
                    <h3>${ch.name}</h3>
                    <p>#${ch.canal || '?'} | ${String(ch.status) === 'true' ? 'Activo' : 'Inactivo'}</p>
                </div>
                ${currentCategoryIndex < 0 ? `<span class="channel-cat-tag">${ch.catTitle}</span>` : ''}
                <button class="btn-icon" style="position:absolute; top:10px; right:10px; opacity:0.5;" onclick="openChannelModal(${ch.chIdx}, ${ch.catIdx})"><i class="fas fa-edit"></i></button>
            `;
            list.appendChild(card);
        });

        if (!list._sortable) {
            list._sortable = new Sortable(list, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    if (currentCategoryIndex < 0) return;
                    const chs = catalogo[currentCategoryIndex].items;
                    const movedItem = chs.splice(evt.oldIndex, 1)[0];
                    chs.splice(evt.newIndex, 0, movedItem);
                }
            });
        }
        list._sortable.option("disabled", currentCategoryIndex < 0);
        updateStats();
    }

    function filterChannels() {
        const query = document.getElementById('channel-search').value;
        renderChannels(query);
    }

    // --- CRUD Categories ---
    function openCategoryModal(index = -1) {
        document.getElementById('edit-category-index').value = index;
        document.getElementById('cat-title').value = index >= 0 ? catalogo[index].title : '';
        document.getElementById('category-modal').style.display = 'flex';
    }

    function saveCategory() {
        const index = parseInt(document.getElementById('edit-category-index').value);
        const title = document.getElementById('cat-title').value.trim();
        if (!title) return;

        if (index >= 0) {
            catalogo[index].title = title;
        } else {
            catalogo.push({ title, items: [] });
            currentCategoryIndex = catalogo.length - 1;
        }
        closeModal('category-modal');
        renderCategories();
    }

    function deleteCategory(index) {
        if (confirm('¿Eliminar esta categoría y todos sus canales?')) {
            catalogo.splice(index, 1);
            currentCategoryIndex = -1;
            renderCategories();
        }
    }

    // --- CRUD Channels ---
    function openChannelModal(chIndex = -1, catIndex = currentCategoryIndex) {
        if (catalogo.length === 0) return novaToast('Cree una categoría primero', 'info');
        if (catIndex < 0 && chIndex === -1) return novaToast('Seleccione una categoría primero', 'info');

        document.getElementById('edit-channel-index').value = chIndex;
        document.getElementById('edit-channel-cat-index').value = catIndex;

        const ch = (chIndex >= 0 && catalogo[catIndex]) ? catalogo[catIndex].items[chIndex] : {
            name: '', icono: '', canal: '', status: 'true', NSFW: 'NO',
            url: '', url2: '', Referer: '', Origin: '', 'User-Agent': '',
            drm_license_uri: '', drm_license_uri2: ''
        };

        document.getElementById('ch-name').value = ch.name || '';
        document.getElementById('ch-icono').value = ch.icono || '';
        document.getElementById('ch-canal').value = ch.canal || '';
        document.getElementById('ch-status').value = String(ch.status) || 'true';
        document.getElementById('ch-nsfw').value = ch.NSFW || 'NO';
        document.getElementById('ch-url').value = ch.url || '';
        document.getElementById('ch-url2').value = ch.url2 || '';
        document.getElementById('ch-referer').value = ch.Referer || '';
        document.getElementById('ch-origin').value = ch.Origin || '';
        document.getElementById('ch-user').value = ch['User-Agent'] || ch.user || '';
        document.getElementById('ch-drm1').value = ch.drm_license_uri || '';
        document.getElementById('ch-drm2').value = ch.drm_license_uri2 || '';

        document.getElementById('modal-title').innerText = chIndex >= 0 ? 'Editar Canal' : 'Nuevo Canal';
        document.getElementById('channel-modal').style.display = 'flex';
    }

    function saveChannel() {
        const chIndex = parseInt(document.getElementById('edit-channel-index').value);
        const catIndex = parseInt(document.getElementById('edit-channel-cat-index').value);

        const existingCh = (chIndex >= 0 && catalogo[catIndex]) ? catalogo[catIndex].items[chIndex] : {};

        const ch = {
            ...existingCh,
            name: document.getElementById('ch-name').value.trim(),
            icono: document.getElementById('ch-icono').value.trim(),
            canal: document.getElementById('ch-canal').value.trim(),
            status: document.getElementById('ch-status').value,
            NSFW: document.getElementById('ch-nsfw').value,
            url: document.getElementById('ch-url').value.trim(),
            url2: document.getElementById('ch-url2').value.trim(),
            Referer: document.getElementById('ch-referer').value.trim(),
            Origin: document.getElementById('ch-origin').value.trim(),
            'User-Agent': document.getElementById('ch-user').value.trim(),
            drm_license_uri: document.getElementById('ch-drm1').value.trim(),
            drm_license_uri2: document.getElementById('ch-drm2').value.trim()
        };

        if (!ch.name) return novaToast('El nombre es obligatorio', 'error');

        if (chIndex >= 0) {
            catalogo[catIndex].items[chIndex] = ch;
        } else {
            catalogo[catIndex].items.push(ch);
        }
        closeModal('channel-modal');
        renderChannels();
    }

    function deleteChannel() {
        const chIndex = parseInt(document.getElementById('edit-channel-index').value);
        const catIndex = parseInt(document.getElementById('edit-channel-cat-index').value);

        if (chIndex >= 0 && confirm('¿Eliminar este canal?')) {
            catalogo[catIndex].items.splice(chIndex, 1);
            closeModal('channel-modal');
            renderChannels();
        }
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Init
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
    restaurarSesion();
</script>
</body>
</html>
