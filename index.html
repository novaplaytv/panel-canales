<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay | Channel Manager</title>
    <link rel="icon" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --sidebar-bg: #121217;
            --card-bg: #1c1c24;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --text-bright: #ffffff;
            --text-main: #b4b4c0;
            --border: #2d2d3a;
            --danger: #ef4444;
            --success: #22c55e;
            --input-bg: #262631;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Navigation Bar --- */
        .nova-nav {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 1500;
            flex-shrink: 0;
        }

        .nova-nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-bright);
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }

        .nova-nav-links {
            display: flex;
            gap: 24px;
        }

        .nova-nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nova-nav-links a:hover {
            color: var(--accent);
        }

        .nova-nav-auth {
            display: flex;
            gap: 16px;
        }

        .app-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            color: var(--text-bright);
            font-weight: 700;
        }

        #category-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .category-item {
            padding: 10px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            user-select: none;
            background: transparent;
            color: var(--text-main);
        }

        .category-item:hover {
            background: var(--card-bg);
        }

        .category-item.active {
            background: var(--accent);
            color: var(--text-bright);
        }

        .category-item.special {
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-radius: 0;
        }

        .category-item .actions {
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            gap: 4px;
        }

        .category-item:hover .actions {
            opacity: 1;
        }

        .btn-icon {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        /* --- Main Content --- */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 32px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .stats-container {
            display: flex;
            gap: 12px;
        }

        .stat-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

        .stat-chip.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border-color: rgba(34, 197, 94, 0.2);
        }

        .stat-chip.gray {
            background: rgba(180, 180, 192, 0.1);
            color: var(--text-main);
            border-color: rgba(180, 180, 192, 0.2);
        }

        .search-container {
            position: relative;
            width: 250px;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-main);
        }

        .search-container input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-bright);
            outline: none;
        }

        #channel-list {
            flex-grow: 1;
            padding: 24px 32px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            align-content: start;
        }

        /* --- Channel Card --- */
        .channel-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: move;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .channel-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .channel-card.no-drag {
            cursor: default;
        }

        .channel-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: #000;
            object-fit: contain;
        }

        .channel-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .channel-info h3 {
            font-size: 0.95rem;
            color: var(--text-bright);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-info p {
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .channel-category-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            background: var(--input-bg);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent);
            font-weight: 600;
        }

        /* --- Forms & Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--sidebar-bg);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        .form-section {
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .form-section h4 {
            color: var(--accent);
            margin-bottom: 16px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-bright);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { background: var(--border); cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--text-main); }
        .btn-ghost:hover { background: var(--border); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { opacity: 0.9; }

        /* --- Auth View --- */
        #auth-view {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 360px;
            padding: 40px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-align: center;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }
        .status.success { display: block; background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid var(--success); }
        .status.error { display: block; background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid var(--error); }

        /* Sortable ghost class */
        .sortable-ghost {
            opacity: 0.4;
            border: 2px dashed var(--accent);
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="nova-nav">
        <a href="#" class="nova-nav-brand">NovaPlay</a>
        <div class="nova-nav-links">
            <a href="#">INICIO</a>
            <a href="#">DEMO</a>
            <a href="#">ICONOS</a>
        </div>
        <div class="nova-nav-auth">
            <button id="navLogin" class="btn btn-primary" onclick="location.reload()">INGRESAR</button>
            <button id="navLogout" class="btn btn-ghost hidden" onclick="cerrarSesion()">SALIR</button>
        </div>
    </nav>

    <div class="app-container">
        <!-- Auth View -->
    <div id="auth-view">
        <div class="auth-card">
            <h2 style="color: var(--text-bright); margin-bottom: 8px;">NovaPlay</h2>
            <p style="margin-bottom: 32px;">Panel de Administración</p>
            <div class="form-group" style="text-align: left;">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Ingrese su usuario" autocomplete="username">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" id="loginButton" style="width: 100%; justify-content: center;" onclick="iniciarSesion()">ENTRAR AL PANEL</button>
            <div id="loginStatus" class="status"></div>
        </div>
    </div>

    <!-- Main Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>NovaPlay</h1>
            <button class="btn-icon" onclick="openCategoryModal()" title="Nueva Categoría">
                <i class="fas fa-plus-circle"></i>
            </button>
        </div>
        <div id="category-list">
            <!-- Categories rendered here -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
        <header>
            <div class="header-left">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="channel-search" placeholder="Buscar canal..." oninput="filterChannels()">
                </div>
                <div class="stats-container">
                    <div class="stat-chip success">
                        <i class="fas fa-check-circle"></i> <span id="active-count">0</span> Activos
                    </div>
                    <div class="stat-chip gray">
                        <i class="fas fa-times-circle"></i> <span id="inactive-count">0</span> Inactivos
                    </div>
                </div>
            </div>
            <div class="header-actions" style="display: flex; gap: 8px;">
                <button class="btn btn-primary" id="new-channel-btn" onclick="openChannelModal()">
                    <i class="fas fa-plus"></i> Nuevo Canal
                </button>
                <button class="btn btn-ghost" onclick="saveData()">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
                <button class="btn btn-danger" onclick="cerrarSesion()" title="Cerrar Sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <div id="channel-list">
            <!-- Channels rendered here -->
        </div>
    </main>
</div>

    <!-- Channel Modal -->
    <div id="channel-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Editar Canal</h2>
                <button class="btn-icon" onclick="closeModal('channel-modal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-channel-index">
                <input type="hidden" id="edit-channel-cat-index">

                <!-- Section: General -->
                <div class="form-section">
                    <h4>Información General</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Nombre del Canal</label>
                            <input type="text" id="ch-name" placeholder="Ej: HBO HD">
                        </div>
                        <div class="form-group">
                            <label>Logo URL (icono)</label>
                            <input type="text" id="ch-icono" placeholder="https://...">
                        </div>
                    </div>
                    <div class="grid-3">
                        <div class="form-group">
                            <label>Número de Canal (canal)</label>
                            <input type="text" id="ch-canal" placeholder="Ej: 101">
                        </div>
                        <div class="form-group">
                            <label>Estado (status)</label>
                            <select id="ch-status">
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>NSFW</label>
                            <select id="ch-nsfw">
                                <option value="NO">NO</option>
                                <option value="YES">YES</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section: Streams -->
                <div class="form-section">
                    <h4>Fuentes de Stream</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>URL Principal</label>
                            <input type="text" id="ch-url" placeholder="http://...">
                        </div>
                        <div class="form-group">
                            <label>URL 2</label>
                            <input type="text" id="ch-url2" placeholder="http://...">
                        </div>
                    </div>
                </div>

                <!-- Section: Advanced -->
                <div class="form-section">
                    <h4>Configuración Avanzada</h4>
                    <div class="grid-3">
                        <div class="form-group">
                            <label>Referer</label>
                            <input type="text" id="ch-referer" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Origin</label>
                            <input type="text" id="ch-origin" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>User Agent (user)</label>
                            <input type="text" id="ch-user" placeholder="Mozilla/5.0...">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>DRM License URI</label>
                            <input type="text" id="ch-drm1" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>DRM License URI 2</label>
                            <input type="text" id="ch-drm2" placeholder="https://...">
                        </div>
                    </div>
                </div>

                <!-- Section: Modes -->
                <div class="form-section">
                    <h4>Modos (web, VLC, watchdog, youtube)</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Web</label>
                            <input type="text" id="ch-mode-web" placeholder="Valor web">
                        </div>
                        <div class="form-group">
                            <label>VLC</label>
                            <input type="text" id="ch-mode-vlc" placeholder="Valor VLC">
                        </div>
                        <div class="form-group">
                            <label>Watchdog</label>
                            <input type="text" id="ch-mode-watchdog" placeholder="Valor watchdog">
                        </div>
                        <div class="form-group">
                            <label>YouTube</label>
                            <input type="text" id="ch-mode-youtube" placeholder="Valor youtube">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button class="btn btn-danger" onclick="deleteChannel()">Eliminar</button>
                    <button class="btn btn-primary" onclick="saveChannel()">Guardar Canal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Categoría</h2>
                <button class="btn-icon" onclick="closeModal('category-modal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-category-index">
                <div class="form-group">
                    <label>Nombre de la Categoría (title)</label>
                    <input type="text" id="cat-title" placeholder="Ej: Deportes">
                </div>
                <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="saveCategory()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-canales';
        let catalogo = [];
        let currentCategoryIndex = -1; // -1 represents "Todos"
        let sessionToken = localStorage.getItem("novaplay_session_token") || "";

        // --- Auth & API ---
        function mostrarEstado(id, tipo, mensaje) {
            const el = document.getElementById(id);
            el.className = "status " + tipo;
            el.textContent = mensaje;
            el.style.display = "block";
        }

        async function fetchJSON(body, usarSesion = false) {
            const headers = { "Content-Type": "application/json" };
            if (usarSesion && sessionToken) headers.Authorization = "Bearer " + sessionToken;
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers,
                    body: JSON.stringify(body)
                });
                const data = await response.json().catch(() => ({ error: "Respuesta inválida." }));
                return { response, data };
            } catch (e) {
                return { response: { ok: false }, data: { error: "Error de red." } };
            }
        }

        async function restaurarSesion() {
            if (!sessionToken) {
                document.getElementById("navLogin").classList.remove("hidden");
                document.getElementById("navLogout").classList.add("hidden");
                return;
            }
            // Validamos sesión llamando a obtener_json, si falla es que el token no sirve
            const { response, data } = await fetchJSON({ action: "obtener_json" }, true);
            if (response.ok && data.success) {
                catalogo = data.json || [];
                UI_MostrarPanel();
                renderCategories();
            } else {
                cerrarSesion();
            }
        }

        function UI_MostrarPanel() {
            document.getElementById("auth-view").classList.add("hidden");
            document.getElementById("navLogin").classList.add("hidden");
            document.getElementById("navLogout").classList.remove("hidden");
        }

        async function iniciarSesion() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("loginButton");
            const statusId = "loginStatus";

            if (!username || !password) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFICANDO...';

            const { response, data } = await fetchJSON({ action: "login", username, password });

            if (response.ok && data.token) {
                sessionToken = data.token;
                localStorage.setItem("novaplay_session_token", sessionToken);
                await loadData();
                UI_MostrarPanel();
            } else {
                mostrarEstado(statusId, "error", "Acceso denegado.");
                btn.disabled = false;
                btn.textContent = "ENTRAR AL PANEL";
            }
        }

        function cerrarSesion() {
            localStorage.removeItem("novaplay_session_token");
            location.reload();
        }

        async function loadData() {
            const { response, data } = await fetchJSON({ action: "obtener_json" }, true);
            if (response.ok && data.success) {
                catalogo = data.json || [];
                renderCategories();
            } else {
                alert('Error al cargar datos: ' + (data.error || 'Sesión expirada'));
                if (response.status === 401) cerrarSesion();
            }
        }

        async function saveData() {
            const { response, data } = await fetchJSON({
                action: "guardar_json",
                content: JSON.stringify(catalogo)
            }, true);

            if (response.ok && data.success) {
                alert('Datos guardados correctamente en Supabase');
            } else {
                alert('Error al guardar: ' + (data.error || 'Desconocido'));
            }
        }

        // --- Stats ---
        function updateStats() {
            let active = 0;
            let inactive = 0;
            catalogo.forEach(cat => {
                (cat.items || []).forEach(ch => {
                    if (ch.status === 'true') active++;
                    else inactive++;
                });
            });
            document.getElementById('active-count').textContent = active;
            document.getElementById('inactive-count').textContent = inactive;
        }

        // --- Renderers ---
        function renderCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';

            // Fixed "Todos" Item
            const todosItem = document.createElement('div');
            todosItem.className = `category-item special ${currentCategoryIndex === -1 ? 'active' : ''}`;
            todosItem.innerHTML = `<span><i class="fas fa-layer-group"></i> Todos</span>`;
            todosItem.onclick = () => selectCategory(-1);
            list.appendChild(todosItem);

            // Container for draggable categories
            const dragList = document.createElement('div');
            dragList.id = 'draggable-categories';
            list.appendChild(dragList);

            catalogo.forEach((cat, index) => {
                const item = document.createElement('div');
                item.className = `category-item ${index === currentCategoryIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <span><i class="fas fa-folder"></i> ${cat.title}</span>
                    <div class="actions">
                        <button class="btn-icon" onclick="openCategoryModal(${index})"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon" onclick="deleteCategory(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                item.onclick = (e) => {
                    if (e.target.closest('.actions')) return;
                    selectCategory(index);
                };
                dragList.appendChild(item);
            });

            // Reorder categories
            if (!dragList._sortable) {
                dragList._sortable = new Sortable(dragList, {
                    animation: 150,
                    onEnd: (evt) => {
                        const movedItem = catalogo.splice(evt.oldIndex, 1)[0];
                        catalogo.splice(evt.newIndex, 0, movedItem);
                        if (currentCategoryIndex !== -1) {
                            currentCategoryIndex = evt.newIndex;
                        }
                        renderCategories();
                    }
                });
            }
            renderChannels();
            updateStats();
        }

        function selectCategory(index) {
            currentCategoryIndex = index;
            renderCategories();
        }

        function renderChannels(filter = '') {
            const list = document.getElementById('channel-list');
            list.innerHTML = '';

            let channelsToRender = [];

            if (currentCategoryIndex === -1) {
                // Show ALL channels
                catalogo.forEach((cat, catIdx) => {
                    (cat.items || []).forEach((ch, chIdx) => {
                        channelsToRender.push({ ...ch, catIdx, chIdx, catTitle: cat.title });
                    });
                });
                document.getElementById('new-channel-btn').disabled = true;
                document.getElementById('new-channel-btn').title = "Seleccione una categoría para agregar canales";
            } else {
                const cat = catalogo[currentCategoryIndex];
                if (cat) {
                    (cat.items || []).forEach((ch, chIdx) => {
                        channelsToRender.push({ ...ch, catIdx: currentCategoryIndex, chIdx });
                    });
                }
                document.getElementById('new-channel-btn').disabled = false;
                document.getElementById('new-channel-btn').title = "";
            }

            channelsToRender.forEach((ch) => {
                if (filter && !ch.name.toLowerCase().includes(filter.toLowerCase())) return;

                const card = document.createElement('div');
                card.className = 'channel-card' + (currentCategoryIndex === -1 ? ' no-drag' : '');
                card.innerHTML = `
                    <img src="${ch.icono}" class="channel-logo" onerror="this.src='https://via.placeholder.com/50?text=?'">
                    <div class="channel-info">
                        <h3>${ch.name}</h3>
                        <p>#${ch.canal || '?'} | ${ch.status === 'true' ? 'Activo' : 'Inactivo'}</p>
                    </div>
                    ${currentCategoryIndex === -1 ? `<span class="channel-category-tag">${ch.catTitle}</span>` : ''}
                    <button class="btn-icon" onclick="openChannelModal(${ch.chIdx}, ${ch.catIdx})"><i class="fas fa-edit"></i></button>
                `;
                list.appendChild(card);
            });

            // Reorder channels
            if (!list._sortable) {
                list._sortable = new Sortable(list, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: (evt) => {
                        if (currentCategoryIndex === -1) return;
                        const chs = catalogo[currentCategoryIndex].items;
                        const movedItem = chs.splice(evt.oldIndex, 1)[0];
                        chs.splice(evt.newIndex, 0, movedItem);
                    }
                });
            }

            // Disable reordering if "Todos" is selected
            list._sortable.option("disabled", currentCategoryIndex === -1);

            updateStats();
        }

        function filterChannels() {
            const query = document.getElementById('channel-search').value;
            renderChannels(query);
        }

        // --- CRUD Categories ---
        function openCategoryModal(index = -1) {
            document.getElementById('edit-category-index').value = index;
            document.getElementById('cat-title').value = index >= 0 ? catalogo[index].title : '';
            document.getElementById('category-modal').style.display = 'flex';
        }

        function saveCategory() {
            const index = parseInt(document.getElementById('edit-category-index').value);
            const title = document.getElementById('cat-title').value.trim();
            if (!title) return;

            if (index >= 0) {
                catalogo[index].title = title;
            } else {
                catalogo.push({ title, items: [] });
                currentCategoryIndex = catalogo.length - 1;
            }
            closeModal('category-modal');
            renderCategories();
        }

        function deleteCategory(index) {
            if (confirm('¿Eliminar esta categoría y todos sus canales?')) {
                catalogo.splice(index, 1);
                currentCategoryIndex = -1;
                renderCategories();
            }
        }

        // --- CRUD Channels ---
        function openChannelModal(chIndex = -1, catIndex = currentCategoryIndex) {
            if (catalogo.length === 0) return alert('Cree una categoría primero');
            if (catIndex === -1 && chIndex === -1) return alert('Seleccione una categoría primero');

            document.getElementById('edit-channel-index').value = chIndex;
            document.getElementById('edit-channel-cat-index').value = catIndex;

            const ch = (chIndex >= 0 && catalogo[catIndex]) ? catalogo[catIndex].items[chIndex] : {
                name: '', icono: '', canal: '', status: 'true', NSFW: 'NO',
                url: '', url2: '', referer: '', origin: '', user: '',
                drm_license_uri: '', drm_license_uri2: '',
                web: '', VLC: '', watchdog: '', youtube: ''
            };

            document.getElementById('ch-name').value = ch.name || '';
            document.getElementById('ch-icono').value = ch.icono || '';
            document.getElementById('ch-canal').value = ch.canal || '';
            document.getElementById('ch-status').value = ch.status || 'true';
            document.getElementById('ch-nsfw').value = ch.NSFW || 'NO';
            document.getElementById('ch-url').value = ch.url || '';
            document.getElementById('ch-url2').value = ch.url2 || '';
            document.getElementById('ch-referer').value = ch.referer || '';
            document.getElementById('ch-origin').value = ch.origin || '';
            document.getElementById('ch-user').value = ch.user || '';
            document.getElementById('ch-drm1').value = ch.drm_license_uri || '';
            document.getElementById('ch-drm2').value = ch.drm_license_uri2 || '';
            document.getElementById('ch-mode-web').value = ch.web || '';
            document.getElementById('ch-mode-vlc').value = ch.VLC || '';
            document.getElementById('ch-mode-watchdog').value = ch.watchdog || '';
            document.getElementById('ch-mode-youtube').value = ch.youtube || '';

            document.getElementById('modal-title').innerText = chIndex >= 0 ? 'Editar Canal' : 'Nuevo Canal';
            document.getElementById('channel-modal').style.display = 'flex';
        }

        function saveChannel() {
            const chIndex = parseInt(document.getElementById('edit-channel-index').value);
            const catIndex = parseInt(document.getElementById('edit-channel-cat-index').value);

            const ch = {
                name: document.getElementById('ch-name').value.trim(),
                icono: document.getElementById('ch-icono').value.trim(),
                canal: document.getElementById('ch-canal').value.trim(),
                status: document.getElementById('ch-status').value,
                NSFW: document.getElementById('ch-nsfw').value,
                url: document.getElementById('ch-url').value.trim(),
                url2: document.getElementById('ch-url2').value.trim(),
                referer: document.getElementById('ch-referer').value.trim(),
                origin: document.getElementById('ch-origin').value.trim(),
                user: document.getElementById('ch-user').value.trim(),
                drm_license_uri: document.getElementById('ch-drm1').value.trim(),
                drm_license_uri2: document.getElementById('ch-drm2').value.trim(),
                web: document.getElementById('ch-mode-web').value.trim(),
                VLC: document.getElementById('ch-mode-vlc').value.trim(),
                watchdog: document.getElementById('ch-mode-watchdog').value.trim(),
                youtube: document.getElementById('ch-mode-youtube').value.trim()
            };

            if (!ch.name) return alert('El nombre es obligatorio');

            if (chIndex >= 0) {
                catalogo[catIndex].items[chIndex] = ch;
            } else {
                catalogo[catIndex].items.push(ch);
            }
            closeModal('channel-modal');
            renderChannels();
        }

        function deleteChannel() {
            const chIndex = parseInt(document.getElementById('edit-channel-index').value);
            const catIndex = parseInt(document.getElementById('edit-channel-cat-index').value);

            if (chIndex >= 0 && confirm('¿Eliminar este canal?')) {
                catalogo[catIndex].items.splice(chIndex, 1);
                closeModal('channel-modal');
                renderChannels();
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Init
        document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
        restaurarSesion();
    </script>
</body>
</html>
