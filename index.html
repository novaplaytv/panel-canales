<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay | Channel Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --sidebar-bg: #121217;
            --card-bg: #1c1c24;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --text-bright: #ffffff;
            --text-main: #b4b4c0;
            --border: #2d2d3a;
            --danger: #ef4444;
            --success: #22c55e;
            --input-bg: #262631;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            color: var(--text-bright);
            font-weight: 700;
        }

        #category-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .category-item {
            padding: 10px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            user-select: none;
        }

        .category-item:hover {
            background: var(--card-bg);
        }

        .category-item.active {
            background: var(--accent);
            color: var(--text-bright);
        }

        .category-item .actions {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .category-item:hover .actions {
            opacity: 1;
        }

        .btn-icon {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        /* --- Main Content --- */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 32px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-main);
        }

        .search-container input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-bright);
            outline: none;
        }

        #channel-list {
            flex-grow: 1;
            padding: 24px 32px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            align-content: start;
        }

        /* --- Channel Card --- */
        .channel-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: move;
            transition: transform 0.2s, border-color 0.2s;
        }

        .channel-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: #000;
            object-fit: contain;
        }

        .channel-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .channel-info h3 {
            font-size: 0.95rem;
            color: var(--text-bright);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-info p {
            font-size: 0.8rem;
            color: var(--text-main);
        }

        /* --- Forms & Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--sidebar-bg);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        .form-section {
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .form-section h4 {
            color: var(--accent);
            margin-bottom: 16px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-bright);
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { background: var(--border); cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--text-main); }
        .btn-ghost:hover { background: var(--border); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { opacity: 0.9; }

        /* --- Auth View --- */
        #auth-view {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 360px;
            padding: 40px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-align: center;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }
        .status.success { display: block; background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid var(--success); }
        .status.error { display: block; background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid var(--error); }

        /* Sortable ghost class */
        .sortable-ghost {
            opacity: 0.4;
            border: 2px dashed var(--accent);
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Auth View -->
    <div id="auth-view">
        <div class="auth-card">
            <h2 style="color: var(--text-bright); margin-bottom: 8px;">NovaPlay</h2>
            <p style="margin-bottom: 32px;">Panel de Administración</p>
            <div class="form-group" style="text-align: left;">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Ingrese su usuario" autocomplete="username">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" id="loginButton" style="width: 100%;" onclick="iniciarSesion()">ENTRAR AL PANEL</button>
            <div id="loginStatus" class="status"></div>
        </div>
    </div>

    <!-- Main Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>NovaPlay</h1>
            <button class="btn-icon" onclick="openCategoryModal()" title="Nueva Categoría">
                <i class="fas fa-plus-circle"></i>
            </button>
        </div>
        <div id="category-list">
            <!-- Categories will be rendered here -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
        <header>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="channel-search" placeholder="Buscar canal..." oninput="filterChannels()">
            </div>
            <div class="header-actions" style="display: flex; gap: 8px;">
                <button class="btn btn-primary" onclick="openChannelModal()">
                    <i class="fas fa-plus"></i> Nuevo Canal
                </button>
                <button class="btn btn-ghost" onclick="saveData()">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
                <button class="btn btn-danger" onclick="cerrarSesion()" title="Cerrar Sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <div id="channel-list">
            <!-- Channels will be rendered here -->
        </div>
    </main>

    <!-- Channel Modal -->
    <div id="channel-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Editar Canal</h2>
                <button class="btn-icon" onclick="closeModal('channel-modal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-channel-index">

                <!-- Section: General -->
                <div class="form-section">
                    <h4>Información General</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Nombre del Canal</label>
                            <input type="text" id="ch-name" placeholder="Ej: HBO HD">
                        </div>
                        <div class="form-group">
                            <label>Logo URL</label>
                            <input type="text" id="ch-logo" placeholder="https://...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Epg ID</label>
                        <input type="text" id="ch-epg" placeholder="HBO.us">
                    </div>
                </div>

                <!-- Section: URLs -->
                <div class="form-section">
                    <h4>Fuentes de Stream</h4>
                    <div class="form-group">
                        <label>URL Principal</label>
                        <input type="text" id="ch-url" placeholder="http://...">
                    </div>
                    <div class="form-group">
                        <label>URL Alternativa</label>
                        <input type="text" id="ch-url2" placeholder="http://...">
                    </div>
                </div>

                <!-- Section: Headers -->
                <div class="form-section">
                    <h4>Headers & Seguridad</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Referer</label>
                            <input type="text" id="ch-referer" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>User Agent</label>
                            <input type="text" id="ch-ua" placeholder="Mozilla/5.0...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Key ID : Key (DRM)</label>
                        <input type="text" id="ch-key" placeholder="kid:key">
                    </div>
                </div>

                <!-- Section: Modes -->
                <div class="form-section">
                    <h4>Configuración de Reproducción</h4>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Modo de Reproducción</label>
                            <select id="ch-mode">
                                <option value="direct">Directo</option>
                                <option value="webview">WebView</option>
                                <option value="mpd">MPEG-DASH</option>
                                <option value="hls">HLS (m3u8)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Visibilidad</label>
                            <select id="ch-visible">
                                <option value="true">Activo</option>
                                <option value="false">Oculto</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button class="btn btn-ghost" onclick="deleteChannel()">Eliminar</button>
                    <button class="btn btn-primary" onclick="saveChannel()">Guardar Canal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Categoría</h2>
                <button class="btn-icon" onclick="closeModal('category-modal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-category-index">
                <div class="form-group">
                    <label>Nombre de la Categoría</label>
                    <input type="text" id="cat-name" placeholder="Ej: Deportes">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="saveCategory()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-canales';
        let categories = [];
        let currentCategoryIndex = 0;
        let sessionToken = localStorage.getItem("novaplay_session_token") || "";

        // --- Auth & API ---
        function mostrarEstado(id, tipo, mensaje) {
            const el = document.getElementById(id);
            el.className = "status " + tipo;
            el.textContent = mensaje;
            el.style.display = "block";
        }

        async function fetchJSON(body, usarSesion = false) {
            const headers = { "Content-Type": "application/json" };
            if (usarSesion && sessionToken) headers.Authorization = "Bearer " + sessionToken;
            try {
                const response = await fetch(API_URL, { method: "POST", headers, body: JSON.stringify(body) });
                const data = await response.json().catch(() => ({ error: "Respuesta inválida." }));
                return { response, data };
            } catch (e) { return { response: { ok: false }, data: { error: "Error de red." } }; }
        }

        async function restaurarSesion() {
            if (!sessionToken) return;
            const { response } = await fetchJSON({ action: "verificar_sesion" }, true);
            if (response.ok) {
                UI_MostrarPanel();
                await loadData();
            } else {
                cerrarSesion();
            }
        }

        function UI_MostrarPanel() {
            document.getElementById("auth-view").classList.add("hidden");
        }

        async function iniciarSesion() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("loginButton");
            const statusId = "loginStatus";

            if (!username || !password) return;

            btn.disabled = true;
            btn.textContent = "VERIFICANDO...";

            const { response, data } = await fetchJSON({ action: "login", username, password });

            if (response.ok && data.token) {
                sessionToken = data.token;
                localStorage.setItem("novaplay_session_token", sessionToken);
                UI_MostrarPanel();
                await loadData();
            } else {
                mostrarEstado(statusId, "error", "Acceso denegado.");
                btn.disabled = false;
                btn.textContent = "ENTRAR AL PANEL";
            }
        }

        function cerrarSesion() {
            localStorage.removeItem("novaplay_session_token");
            location.reload();
        }

        async function loadData() {
            const { response, data } = await fetchJSON({ action: "obtener_json" }, true);
            if (response.ok) {
                categories = data || [];
                renderCategories();
            } else {
                alert('Error al cargar datos: ' + (data.error || 'Sesión expirada'));
                if (response.status === 401) cerrarSesion();
            }
        }

        async function saveData() {
            const { response, data } = await fetchJSON({ action: "guardar_json", data: categories }, true);
            if (response.ok) {
                alert('Datos guardados correctamente');
            } else {
                alert('Error al guardar: ' + (data.error || 'Desconocido'));
            }
        }

        // --- Renderers ---
        function renderCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            categories.forEach((cat, index) => {
                const item = document.createElement('div');
                item.className = `category-item ${index === currentCategoryIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <span><i class="fas fa-folder mr-2"></i> ${cat.name}</span>
                    <div class="actions">
                        <button class="btn-icon" onclick="openCategoryModal(${index})"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon" onclick="deleteCategory(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                item.onclick = (e) => {
                    if (e.target.closest('.actions')) return;
                    selectCategory(index);
                };
                list.appendChild(item);
            });

            // Enable Category Drag & Drop
            new Sortable(list, {
                animation: 150,
                onEnd: (evt) => {
                    const movedItem = categories.splice(evt.oldIndex, 1)[0];
                    categories.splice(evt.newIndex, 0, movedItem);
                    currentCategoryIndex = evt.newIndex;
                }
            });

            renderChannels();
        }

        function selectCategory(index) {
            currentCategoryIndex = index;
            renderCategories();
        }

        function renderChannels(filter = '') {
            const list = document.getElementById('channel-list');
            list.innerHTML = '';

            if (!categories[currentCategoryIndex]) return;

            const channels = categories[currentCategoryIndex].channels || [];

            channels.forEach((ch, index) => {
                if (filter && !ch.name.toLowerCase().includes(filter.toLowerCase())) return;

                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://via.placeholder.com/50?text=?'">
                    <div class="channel-info">
                        <h3>${ch.name}</h3>
                        <p>${ch.mode.toUpperCase()} | ${ch.visible ? 'Activo' : 'Oculto'}</p>
                    </div>
                    <button class="btn-icon" onclick="openChannelModal(${index})"><i class="fas fa-cog"></i></button>
                `;
                list.appendChild(card);
            });

            // Enable Channel Drag & Drop
            new Sortable(list, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const chs = categories[currentCategoryIndex].channels;
                    const movedItem = chs.splice(evt.oldIndex, 1)[0];
                    chs.splice(evt.newIndex, 0, movedItem);
                }
            });
        }

        function filterChannels() {
            const query = document.getElementById('channel-search').value;
            renderChannels(query);
        }

        // --- CRUD Categories ---
        function openCategoryModal(index = -1) {
            document.getElementById('edit-category-index').value = index;
            document.getElementById('cat-name').value = index >= 0 ? categories[index].name : '';
            document.getElementById('category-modal').style.display = 'flex';
        }

        function saveCategory() {
            const index = parseInt(document.getElementById('edit-category-index').value);
            const name = document.getElementById('cat-name').value;
            if (!name) return;

            if (index >= 0) {
                categories[index].name = name;
            } else {
                categories.push({ name, channels: [] });
                currentCategoryIndex = categories.length - 1;
            }
            closeModal('category-modal');
            renderCategories();
        }

        function deleteCategory(index) {
            if (confirm('¿Eliminar esta categoría y todos sus canales?')) {
                categories.splice(index, 1);
                currentCategoryIndex = 0;
                renderCategories();
            }
        }

        // --- CRUD Channels ---
        function openChannelModal(index = -1) {
            if (!categories[currentCategoryIndex]) return alert('Cree una categoría primero');

            document.getElementById('edit-channel-index').value = index;
            const ch = index >= 0 ? categories[currentCategoryIndex].channels[index] : {
                name: '', logo: '', url: '', url2: '', referer: '', ua: '', key: '', mode: 'direct', visible: true, epg: ''
            };

            document.getElementById('ch-name').value = ch.name;
            document.getElementById('ch-logo').value = ch.logo;
            document.getElementById('ch-url').value = ch.url;
            document.getElementById('ch-url2').value = ch.url2;
            document.getElementById('ch-referer').value = ch.referer;
            document.getElementById('ch-ua').value = ch.ua;
            document.getElementById('ch-key').value = ch.key;
            document.getElementById('ch-mode').value = ch.mode;
            document.getElementById('ch-visible').value = ch.visible.toString();
            document.getElementById('ch-epg').value = ch.epg;

            document.getElementById('modal-title').innerText = index >= 0 ? 'Editar Canal' : 'Nuevo Canal';
            document.getElementById('channel-modal').style.display = 'flex';
        }

        function saveChannel() {
            const index = parseInt(document.getElementById('edit-channel-index').value);
            const ch = {
                name: document.getElementById('ch-name').value,
                logo: document.getElementById('ch-logo').value,
                url: document.getElementById('ch-url').value,
                url2: document.getElementById('ch-url2').value,
                referer: document.getElementById('ch-referer').value,
                ua: document.getElementById('ch-ua').value,
                key: document.getElementById('ch-key').value,
                mode: document.getElementById('ch-mode').value,
                visible: document.getElementById('ch-visible').value === 'true',
                epg: document.getElementById('ch-epg').value
            };

            if (!ch.name || !ch.url) return alert('Nombre y URL son obligatorios');

            if (index >= 0) {
                categories[currentCategoryIndex].channels[index] = ch;
            } else {
                categories[currentCategoryIndex].channels.push(ch);
            }
            closeModal('channel-modal');
            renderChannels();
        }

        function deleteChannel() {
            const index = parseInt(document.getElementById('edit-channel-index').value);
            if (index >= 0 && confirm('¿Eliminar este canal?')) {
                categories[currentCategoryIndex].channels.splice(index, 1);
                closeModal('channel-modal');
                renderChannels();
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Initialize
        document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
        restaurarSesion();

    </script>
</body>
</html>
